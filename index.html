<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Photo Gallery</title>
<style>
body {font-family: Arial, sans-serif; margin:0; padding:0; background-color:#f4f4f4;}
header {background-color:#333; color:#fff; padding:1rem; text-align:center;}
section {padding:2rem;}
section h2 {margin-top:0;}
.gallery {display:flex; flex-wrap:wrap; gap:1rem;}
.gallery img {max-width:100%; height:auto; border-radius:8px;}
footer {background-color:#333; color:#fff; text-align:center; padding:1rem;}
</style>
</head>
<body>
<header><h1>My Photo Gallery</h1></header>
<section>
<h2>Nature</h2>
<div class="gallery">
<img src="https://images.pexels.com/photos/414171/pexels-photo-414171.jpeg" alt="Mountain Lake" width="400" height="300">
<img src="https://picsum.photos/id/1015/800/600" alt="Fjord Landscape" width="400" height="300">
</div>
</section>
<section>
<h2>Animals</h2>
<div class="gallery">
<img src="https://picsum.photos/id/1074/800/600" alt="Lion" width="400" height="300">
<img src="https://picsum.photos/id/1024/800/600" alt="Bird in flight" width="400" height="300">
</div>
</section>
<section>
<h2>Travel</h2>
<div class="gallery">
<img src="https://picsum.photos/seed/travel1/800/600" alt="Travel Image 1" width="400" height="300">
<img src="https://picsum.photos/seed/travel2/800/600" alt="Travel Image 2" width="400" height="300">
</div>
</section>
<footer>&copy; 2026 Photo Gallery</footer>
</body>
</html>
